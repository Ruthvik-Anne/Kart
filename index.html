<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f3b30" />
    <meta name="description" content="KART brings campus food, supplies, services, events, tasks and student resale together in one live marketplace." />
    <title>KART — Your campus, connected</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23f0a63f'/><text x='50' y='68' font-size='56' font-family='sans-serif' font-weight='800' text-anchor='middle' fill='%230f3b30'>K</text></svg>" />
    <link rel="stylesheet" href="./styles.css" />
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('kart-v2') || '{}');
        var t = (s.settings && s.settings.theme) || 'light';
        if (t === 'system') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script src="./qr.js"></script>
    <script src="./data.js"></script>
    <script src="./store.js"></script>
    <script src="./ui.js"></script>
    <script src="./modals.js"></script>
    <script src="./pages.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
