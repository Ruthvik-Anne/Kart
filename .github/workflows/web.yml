name: web

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kart
          POSTGRES_PASSWORD: kart_local_dev
          POSTGRES_DB: kart
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://kart:kart_local_dev@localhost:5432/kart
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run db:seed
      - run: docker build -t kart-web-ci .
      - name: Container smoke
        run: |
          docker run --name kart-web-ci -d -p 127.0.0.1:3201:3000 kart-web-ci
          trap 'docker rm -f kart-web-ci' EXIT
          npx --yes wait-on --timeout 30000 http://127.0.0.1:3201/live
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r ../backend/requirements.txt
      - name: Browser end-to-end
        timeout-minutes: 6
        env:
          CHROME_PATH: /usr/bin/google-chrome
          KART_DEMO_MODE: '1'
          KART_SESSION_SECRET: ci-local-demo-secret-at-least-32-characters
          KART_BACKEND_URL: http://127.0.0.1:8000
          KART_DB_PATH: /tmp/kart-live-e2e.db
          BASE_URL: http://127.0.0.1:3100
        run: |
          PYTHONPATH=../backend python -m uvicorn app.main:app --port 8000 &
          npx next start -p 3100 &
          npx --yes wait-on --timeout 120000 http://127.0.0.1:8000/health http://127.0.0.1:3100/login
          npm run test:e2e
          node e2e/live.mjs
          KART_APP_MODE=campus npx next start -p 3101 &
          npx --yes wait-on --timeout 30000 http://127.0.0.1:3101/live
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3101/login)" = 307
          curl -sI http://127.0.0.1:3101/login | grep -iq 'location: .*\/live'
